<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEJAKKU</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7eee9;
      color: #4f403a;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    h1 {
      color: #6b4f45;
      font-size: 34px;
      margin-bottom: 5px;
    }

    h2 {
      color: #6b4f45;
    }

    p {
      font-size: 18px;
    }

    input,
    select,
    textarea {

      width: 90%;
      max-width: 350px;

      padding: 14px;

      margin: 8px 0;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      background: white;

      font-family: Arial, sans-serif;

    }

    textarea {

      min-height: 100px;

      resize: vertical;

    }

    button {

      width: 90%;
      max-width: 350px;

      padding: 14px;

      margin-top: 10px;

      border: none;

      border-radius: 10px;

      background: #d88c9a;

      color: white;

      font-size: 17px;

      cursor: pointer;

    }

    button:active {

      transform: scale(0.98);

    }

    #loginPage {

      display: block;

    }

    #scanPage {

      display: none;

    }

    #dashboardPage {

      display: none;

    }

    #reader {

      width: 100%;

      background: white;

      border-radius: 15px;

      padding: 10px;

      margin-top: 20px;

      overflow: hidden;

    }

    #hasil {

      margin-top: 20px;

      padding: 18px;

      background: white;

      border-radius: 12px;

      font-size: 18px;

      min-height: 70px;

    }

    #formHasil {

      display: none;

      margin-top: 20px;

      padding: 18px;

      background: white;

      border-radius: 12px;

    }

    .user {

      background: white;

      padding: 12px;

      border-radius: 10px;

      margin-top: 15px;

      font-size: 17px;

    }

    .error {

      color: #d00000;

      margin-top: 15px;

      font-weight: bold;

    }

    .success {

      color: green;

      font-weight: bold;

    }

    .loading {

      color: #8a6a60;

      font-weight: bold;

    }

    .label {

      display: block;

      width: 90%;

      max-width: 350px;

      margin: 12px auto 2px;

      text-align: left;

      font-weight: bold;

    }

    .qr-result {

      width: 90%;

      max-width: 350px;

      margin: 10px auto;

      padding: 12px;

      background: #f7eee9;

      border-radius: 10px;

      word-break: break-word;

    }

    .dashboard-grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 20px;

    }

    .card {

      background: white;

      padding: 18px 10px;

      border-radius: 12px;

    }

    .card-icon {

      font-size: 28px;

    }

    .card-number {

      font-size: 28px;

      font-weight: bold;

      margin-top: 5px;

    }

    .full-card {

      grid-column: 1 / 3;

    }

    .riwayat {

      background: white;

      padding: 15px;

      margin-top: 10px;

      border-radius: 12px;

      text-align: left;

      word-break: break-word;

    }

  </style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage" class="container">

  <h1>JEJAKKU</h1>

  <p>LOGIN PETUGAS</p>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="login()">
    MASUK
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- =====================================================
     SCANNER
===================================================== -->

<div id="scanPage" class="container">

  <h1>JEJAKKU</h1>

  <p>SCAN QR CODE</p>

  <div class="user">

    👤 Petugas:

    <b id="namaPetugas"></b>

  </div>


  <button onclick="tampilDashboard()">

    📊 DASHBOARD

  </button>


  <div id="reader"></div>


  <div id="hasil">

    📷 Menyiapkan kamera...

  </div>


  <!-- =================================================
       FORM STATUS DAN KETERANGAN
  ================================================== -->

  <div id="formHasil">

    <h2>DATA HASIL SCAN</h2>


    <div class="label">

      Hasil QR Code

    </div>


    <div class="qr-result">

      <b id="kodeQR"></b>

    </div>


    <div class="label">

      Status

    </div>


    <select id="status">

      <option value="">

        -- Pilih Status --

      </option>

      <option value="Diterima">

        Diterima

      </option>

      <option value="Diproses">

        Diproses

      </option>

      <option value="Selesai">

        Selesai

      </option>

      <option value="Dikembalikan">

        Dikembalikan

      </option>

    </select>


    <div class="label">

      Keterangan

    </div>


    <textarea
      id="keterangan"
      placeholder="Masukkan keterangan..."
    ></textarea>


    <button onclick="simpanData()">

      💾 SIMPAN DATA

    </button>


    <div
      id="formError"
      class="error"
    ></div>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboardPage" class="container">

  <h1>JEJAKKU</h1>

  <p>📊 DASHBOARD</p>


  <div class="user">

    👤 Petugas:

    <b id="namaPetugasDashboard"></b>

  </div>


  <div id="dashboardHasil">

    ⏳ Memuat data...

  </div>


  <button onclick="kembaliScanner()">

    📷 KEMBALI SCAN

  </button>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwG9WUnSVBaa1bccVvjchz0teJ7edTLhxrYqm1iACQ4FuMYpSmlWOZR9Lv0SmqiMQM/exec";


/* =====================================================
   VARIABEL
===================================================== */

let sudahScan = false;

let sudahSimpan = false;

let namaUser = "";

let usernameAktif = "";

let kodeQRhasil = "";

let html5QrCode = null;


/* =====================================================
   LOGIN
===================================================== */

function login() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value
      .trim();


  const errorBox =
    document.getElementById("loginError");


  if (!username || !password) {

    errorBox.innerHTML =
      "❌ Username dan password wajib diisi";

    return;

  }


  errorBox.innerHTML =
    "<span class='loading'>" +
    "⏳ Memeriksa login..." +
    "</span>";


  const url =

    WEB_APP_URL +

    "?action=login" +

    "&username=" +
    encodeURIComponent(username) +

    "&password=" +
    encodeURIComponent(password) +

    "&t=" +
    new Date().getTime();


  fetch(url, {

    method: "GET",

    redirect: "follow"

  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    console.log(
      "HASIL LOGIN:",
      result
    );


    if (result.berhasil === true) {

      namaUser =
        result.nama;


      usernameAktif =
        result.username;


      sessionStorage.setItem(
        "jejakkuUser",
        namaUser
      );


      sessionStorage.setItem(
        "jejakkuUsername",
        usernameAktif
      );


      tampilScanner();

    }

    else {

      errorBox.innerHTML =
        "❌ Username atau password salah";

    }

  })

  .catch(function(error) {

    console.error(
      "ERROR LOGIN:",
      error
    );


    errorBox.innerHTML =
      "❌ Tidak dapat terhubung ke server";

  });

}


/* =====================================================
   TAMPIL SCANNER
===================================================== */

function tampilScanner() {

  document
    .getElementById("loginPage")
    .style.display = "none";


  document
    .getElementById("dashboardPage")
    .style.display = "none";


  document
    .getElementById("scanPage")
    .style.display = "block";


  document
    .getElementById("namaPetugas")
    .innerText =
      namaUser;


  document
    .getElementById("formHasil")
    .style.display = "none";


  document
    .getElementById("hasil")
    .innerHTML =
      "📷 Meminta izin kamera...";


  setTimeout(function() {

    mulaiScanner();

  }, 500);

}


/* =====================================================
   MULAI SCANNER
===================================================== */

function mulaiScanner() {

  sudahScan = false;

  sudahSimpan = false;


  document
    .getElementById("formHasil")
    .style.display = "none";


  document
    .getElementById("reader")
    .innerHTML = "";


  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    },

    berhasilScan,

    function(errorMessage) {

      // Error scan diabaikan

    }

  )

  .then(function() {

    document
      .getElementById("hasil")
      .innerHTML =

        "📷 <b>KAMERA AKTIF</b>" +

        "<br><br>" +

        "Arahkan kamera ke QR Code";

  })

  .catch(function(error) {

    console.error(
      "KAMERA ERROR:",
      error
    );


    document
      .getElementById("hasil")
      .innerHTML =

        "❌ <b>KAMERA TIDAK DAPAT DIAKSES</b>" +

        "<br><br>" +

        "Pastikan izin kamera browser sudah diizinkan.";

  });

}


/* =====================================================
   QR TERBACA
===================================================== */

function berhasilScan(kodeQR) {

  if (sudahScan) {

    return;

  }


  sudahScan = true;

  kodeQRhasil = kodeQR;


  if (html5QrCode) {

    html5QrCode

      .stop()

      .catch(function(error) {

        console.log(error);

      });

  }


  document
    .getElementById("hasil")
    .innerHTML =

      "✅ <b>QR TERBACA</b>";


  document
    .getElementById("kodeQR")
    .innerText =
      kodeQR;


  document
    .getElementById("status")
    .value = "";


  document
    .getElementById("keterangan")
    .value = "";


  document
    .getElementById("formError")
    .innerHTML = "";


  document
    .getElementById("formHasil")
    .style.display =
      "block";


  document
    .getElementById("formHasil")
    .scrollIntoView({

      behavior: "smooth"

    });

}


/* =====================================================
   SIMPAN DATA
===================================================== */

function simpanData() {

  if (sudahSimpan) {

    return;

  }


  const status =

    document
      .getElementById("status")
      .value;


  const keterangan =

    document
      .getElementById("keterangan")
      .value
      .trim();


  const formError =

    document
      .getElementById("formError");


  if (!status) {

    formError.innerHTML =
      "❌ Silakan pilih status";

    return;

  }


  if (!keterangan) {

    formError.innerHTML =
      "❌ Silakan isi keterangan";

    return;

  }


  sudahSimpan = true;


  formError.innerHTML =

    "<span class='loading'>" +

    "⏳ Menyimpan data..." +

    "</span>";


  const data = {

    kodeQR:
      kodeQRhasil,

    namaUser:
      namaUser,

    username:
      usernameAktif,

    status:
      status,

    keterangan:
      keterangan

  };


  fetch(WEB_APP_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {

      "Content-Type":
        "text/plain"

    },

    body:
      JSON.stringify(data)

  })

  .then(function() {


    document
      .getElementById("formHasil")
      .style.display =
        "none";


    document
      .getElementById("hasil")
      .innerHTML =

        "<span class='success'>" +

        "✅ DATA BERHASIL DISIMPAN" +

        "</span>" +

        "<br><br>" +

        "Petugas: <b>" +

        namaUser +

        "</b>" +

        "<br>" +

        "Status: <b>" +

        status +

        "</b>";


    setTimeout(function() {

      document
        .getElementById("hasil")
        .innerHTML =

          "📷 <b>SIAP SCAN</b>" +

          "<br><br>" +

          "Arahkan kamera ke QR Code berikutnya";


      document
        .getElementById("reader")
        .innerHTML = "";


      sudahScan = false;

      sudahSimpan = false;


      mulaiScanner();

    }, 1500);

  })

  .catch(function(error) {

    console.error(
      "GAGAL SIMPAN:",
      error
    );


    sudahSimpan = false;


    formError.innerHTML =

      "❌ Gagal menyimpan data." +

      "<br>" +

      "Silakan coba lagi.";

  });

}


/* =====================================================
   DASHBOARD
===================================================== */

function tampilDashboard() {


  /* MATIKAN KAMERA */

  if (html5QrCode) {

    html5QrCode
      .stop()
      .catch(function() {});

  }


  document
    .getElementById("scanPage")
    .style.display = "none";


  document
    .getElementById("dashboardPage")
    .style.display = "block";


  document
    .getElementById("namaPetugasDashboard")
    .innerText =
      namaUser;


  document
    .getElementById("dashboardHasil")
    .innerHTML =
      "⏳ Memuat data dashboard...";


  const url =

    WEB_APP_URL +

    "?action=dashboard" +

    "&t=" +

    new Date().getTime();


  fetch(url)

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {

      tampilDataDashboard(data);

    })

    .catch(function(error) {

      console.error(error);

      document
        .getElementById("dashboardHasil")
        .innerHTML =
          "❌ Gagal mengambil data dashboard";

    });

}


/* =====================================================
   TAMPIL DASHBOARD
===================================================== */

function tampilDataDashboard(data) {

  let html = "";


  html += `

    <div class="dashboard-grid">

      <div class="card">

        <div class="card-icon">
          📋
        </div>

        <b>
          Total Scan
        </b>

        <div class="card-number">
          ${data.total}
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          📥
        </div>

        <b>
          Diterima
        </b>

        <div class="card-number">
          ${data.diterima}
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          🔄
        </div>

        <b>
          Diproses
        </b>

        <div class="card-number">
          ${data.diproses}
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          ✅
        </div>

        <b>
          Selesai
        </b>

        <div class="card-number">
          ${data.selesai}
        </div>

      </div>


      <div class="card full-card">

        <div class="card-icon">
          ↩️
        </div>

        <b>
          Dikembalikan
        </b>

        <div class="card-number">
          ${data.dikembalikan}
        </div>

      </div>

    </div>

  `;


  html += `

    <h2>
      📋 RIWAYAT TERBARU
    </h2>

  `;


  if (
    !data.riwayat ||
    data.riwayat.length === 0
  ) {

    html += `

      <div class="riwayat">

        Belum ada data scan.

      </div>

    `;

  }

  else {

    data.riwayat.forEach(function(item) {

      html += `

        <div class="riwayat">

          <b>
            ${item.kodeQR}
          </b>

          <br><br>

          🕐 ${item.waktu}

          <br>

          👤 ${item.petugas}

          <br>

          📌 <b>
            ${item.status}
          </b>

          <br>

          📝 ${item.keterangan}

        </div>

      `;

    });

  }


  document
    .getElementById("dashboardHasil")
    .innerHTML =
      html;

}


/* =====================================================
   KEMBALI KE SCANNER
===================================================== */

function kembaliScanner() {

  document
    .getElementById("dashboardPage")
    .style.display = "none";


  document
    .getElementById("scanPage")
    .style.display = "block";


  document
    .getElementById("hasil")
    .innerHTML =

      "📷 <b>SIAP SCAN</b>" +

      "<br><br>" +

      "Arahkan kamera ke QR Code";


  document
    .getElementById("reader")
    .innerHTML = "";


  sudahScan = false;

  sudahSimpan = false;


  mulaiScanner();

}

</script>

</body>
</html>
