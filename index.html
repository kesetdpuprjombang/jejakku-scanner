```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEJAKKU</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7eee9;
      text-align: center;
      color: #4f403a;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 15px;
    }

    h1 {
      color: #6b4f45;
      margin-bottom: 5px;
      font-size: 34px;
    }

    h2 {
      color: #6b4f45;
    }

    p {
      font-size: 18px;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #d88c9a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #loginPage {
      display: block;
    }

    #scanPage {
      display: none;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      padding: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    #hasil {
      margin-top: 20px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      min-height: 60px;
    }

    .error {
      color: #d00000;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .user {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 17px;
    }

    .logout {
      background: #888;
      font-size: 14px;
      padding: 10px;
      margin-top: 20px;
    }

    .loading {
      color: #8a6a60;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- =====================================================
     HALAMAN LOGIN
===================================================== -->

<div id="loginPage" class="container">

  <h1>JEJAKKU</h1>

  <p>LOGIN PETUGAS</p>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="login()">
    MASUK
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- =====================================================
     HALAMAN SCANNER
===================================================== -->

<div id="scanPage" class="container">

  <h1>JEJAKKU</h1>

  <p>SCAN QR CODE</p>

  <div class="user">
    👤 Petugas:
    <b id="namaPetugas"></b>
  </div>

  <div id="reader"></div>

  <div id="hasil">
    📷 Menyiapkan kamera...
  </div>

  <button class="logout" onclick="logout()">
    KELUAR
  </button>

</div>


<script>

/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwG9WUnSVBaa1bccVvjchz0teJ7edTLhxrYqm1iACQ4FuMYpSmlWOZR9Lv0SmqiMQM/exec";


/* =====================================================
   VARIABEL
===================================================== */

let sudahScan = false;
let namaUser = "";
let usernameAktif = "";
let html5QrCode = null;


/* =====================================================
   LOGIN
===================================================== */

function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const errorBox =
    document.getElementById("loginError");


  /* CEK ISIAN */

  if (!username || !password) {

    errorBox.innerHTML =
      "❌ Username dan password wajib diisi";

    return;
  }


  /* STATUS */

  errorBox.innerHTML =
    "<span class='loading'>⏳ Memeriksa login...</span>";


  /* URL LOGIN */

  const url =
    WEB_APP_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(username) +
    "&password=" +
    encodeURIComponent(password) +
    "&t=" +
    new Date().getTime();


  /* REQUEST KE APPS SCRIPT */

  fetch(url, {
    method: "GET",
    redirect: "follow"
  })

  .then(function(response) {

    if (!response.ok) {
      throw new Error(
        "Server error: " + response.status
      );
    }

    return response.json();

  })

  .then(function(result) {

    console.log("HASIL LOGIN:", result);


    /* LOGIN BERHASIL */

    if (result.berhasil === true) {

      namaUser = result.nama;

      usernameAktif = result.username;


      sessionStorage.setItem(
        "jejakkuUser",
        namaUser
      );

      sessionStorage.setItem(
        "jejakkuUsername",
        usernameAktif
      );


      tampilScanner();

    }

    /* LOGIN GAGAL */

    else {

      errorBox.innerHTML =
        "❌ Username atau password salah";

    }

  })

  .catch(function(error) {

    console.error("ERROR LOGIN:", error);

    errorBox.innerHTML =
      "❌ Tidak dapat terhubung ke server";

  });
}


/* =====================================================
   TAMPILKAN SCANNER
===================================================== */

function tampilScanner() {

  document.getElementById("loginPage")
    .style.display = "none";

  document.getElementById("scanPage")
    .style.display = "block";

  document.getElementById("namaPetugas")
    .innerText = namaUser;


  document.getElementById("hasil")
    .innerHTML =
      "📷 Meminta izin kamera...";


  /*
     Tunggu halaman tampil terlebih dahulu
  */

  setTimeout(function() {

    mulaiScanner();

  }, 500);
}


/* =====================================================
   MULAI KAMERA
===================================================== */

function mulaiScanner() {

  sudahScan = false;


  /*
     Bersihkan reader jika sebelumnya pernah digunakan
  */

  document.getElementById("reader")
    .innerHTML = "";


  html5QrCode =
    new Html5Qrcode("reader");


  /*
     KAMERA BELAKANG
  */

  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0
    },

    berhasilScan,

    function(errorMessage) {

      /*
         Error pembacaan QR
         tidak ditampilkan agar layar bersih
      */

    }

  )

  .then(function() {

    document.getElementById("hasil")
      .innerHTML =
        "📷 <b>KAMERA AKTIF</b><br><br>" +
        "Arahkan kamera ke QR Code";

  })

  .catch(function(error) {

    console.error(
      "KAMERA ERROR:",
      error
    );

    document.getElementById("hasil")
      .innerHTML =
        "❌ <b>KAMERA TIDAK DAPAT DIAKSES</b>" +
        "<br><br>" +
        "Pastikan izin kamera browser sudah diizinkan.";

  });
}


/* =====================================================
   QR BERHASIL TERBACA
===================================================== */

function berhasilScan(kodeQR) {

  /*
     Mencegah QR yang sama tersimpan berkali-kali
  */

  if (sudahScan) {
    return;
  }

  sudahScan = true;


  /*
     Hentikan kamera
  */

  if (html5QrCode) {

    html5QrCode.stop()

      .then(function() {

        console.log(
          "Kamera dihentikan"
        );

      })

      .catch(function(error) {

        console.log(
          "Stop camera:",
          error
        );

      });
  }


  /*
     Tampilkan hasil QR
  */

  document.getElementById("hasil")
    .innerHTML =
      "✅ <b>QR TERBACA</b>" +
      "<br><br>" +
      "<b>" +
      kodeQR +
      "</b>" +
      "<br><br>" +
      "⏳ Menyimpan data...";


  /*
     DATA YANG DIKIRIM
  */

  const data = {

    kodeQR: kodeQR,

    namaUser: namaUser,

    username: usernameAktif

  };


  /*
     KIRIM KE GOOGLE APPS SCRIPT
  */

  fetch(WEB_APP_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {

      "Content-Type":
        "text/plain"

    },

    body:
      JSON.stringify(data)

  })

  .then(function() {

    /*
       BERHASIL
    */

    document.getElementById("hasil")
      .innerHTML =
        "<span class='success'>" +
        "✅ BERHASIL" +
        "</span>" +
        "<br><br>" +
        "Kode: <b>" +
        kodeQR +
        "</b>" +
        "<br>" +
        "Petugas: <b>" +
        namaUser +
        "</b>" +
        "<br><br>" +
        "Data sudah masuk Google Sheet.";


    /*
       KEMBALI KE HALAMAN AWAL
       setelah 1,5 detik
    */

    setTimeout(function() {

      location.reload();

    }, 1500);

  })

  .catch(function(error) {

    console.error(
      "GAGAL KIRIM:",
      error
    );

    document.getElementById("hasil")
      .innerHTML =
        "❌ <b>Gagal menyimpan data</b>" +
        "<br><br>" +
        "Silakan coba scan kembali.";

    sudahScan = false;

  });
}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  /*
     Matikan kamera
  */

  if (html5QrCode) {

    html5QrCode
      .stop()
      .catch(function() {});

  }


  /*
     Hapus session
  */

  sessionStorage.removeItem(
    "jejakkuUser"
  );

  sessionStorage.removeItem(
    "jejakkuUsername"
  );


  /*
     Kembali ke login
  */

  location.reload();
}

</script>

</body>
</html>
