<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEJAKKU</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7eee9;
      text-align: center;
      color: #4f403a;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 15px;
    }

    h1 {
      color: #6b4f45;
      margin-bottom: 5px;
      font-size: 34px;
    }

    p {
      font-size: 18px;
    }

    input,
    select,
    textarea {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #d88c9a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #loginPage {
      display: block;
    }

    #scanPage {
      display: none;
    }

    #formHasil {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: white;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      padding: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    #hasil {
      margin-top: 20px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      min-height: 70px;
    }

    .error {
      color: #d00000;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .user {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 17px;
    }

    .loading {
      color: #8a6a60;
      font-weight: bold;
    }

    .label {
      display: block;
      text-align: left;
      width: 90%;
      max-width: 350px;
      margin: 12px auto 2px;
      font-weight: bold;
    }

    .qr-result {
      background: #f7eee9;
      padding: 12px;
      border-radius: 10px;
      margin: 10px auto 15px;
      width: 90%;
      max-width: 350px;
      word-break: break-word;
    }
  </style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage" class="container">

  <h1>JEJAKKU</h1>

  <p>LOGIN PETUGAS</p>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="login()">
    MASUK
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- =====================================================
     SCANNER
===================================================== -->

<div id="scanPage" class="container">

  <h1>JEJAKKU</h1>

  <p>SCAN QR CODE</p>

  <div class="user">
    👤 Petugas:
    <b id="namaPetugas"></b>
  </div>


  <!-- KAMERA -->

  <div id="reader"></div>


  <!-- INFORMASI KAMERA -->

  <div id="hasil">
    📷 Menyiapkan kamera...
  </div>


  <!-- =================================================
       FORM SETELAH SCAN
  ================================================== -->

  <div id="formHasil">

    <h2>DATA HASIL SCAN</h2>

    <div class="label">
      Hasil QR Code
    </div>

    <div class="qr-result">
      <b id="kodeQR"></b>
    </div>


    <div class="label">
      Status
    </div>

    <select id="status">

      <option value="">
        -- Pilih Status --
      </option>

      <option value="Diterima">
        Diterima
      </option>

      <option value="Diproses">
        Diproses
      </option>

      <option value="Selesai">
        Selesai
      </option>

      <option value="Dikembalikan">
        Dikembalikan
      </option>

    </select>


    <div class="label">
      Keterangan
    </div>

    <textarea
      id="keterangan"
      placeholder="Masukkan keterangan..."
    ></textarea>


    <button onclick="simpanData()">
      💾 SIMPAN DATA
    </button>

    <div
      id="formError"
      class="error"
    ></div>

  </div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwG9WUnSVBaa1bccVvjchz0teJ7edTLhxrYqm1iACQ4FuMYpSmlWOZR9Lv0SmqiMQM/exec";


/* =====================================================
   VARIABEL
===================================================== */

let sudahScan = false;

let sudahSimpan = false;

let namaUser = "";

let usernameAktif = "";

let kodeQRhasil = "";

let html5QrCode = null;


/* =====================================================
   LOGIN
===================================================== */

function login() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value
      .trim();

  const errorBox =
    document.getElementById("loginError");


  if (!username || !password) {

    errorBox.innerHTML =
      "❌ Username dan password wajib diisi";

    return;
  }


  errorBox.innerHTML =
    "<span class='loading'>⏳ Memeriksa login...</span>";


  const url =
    WEB_APP_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(username) +
    "&password=" +
    encodeURIComponent(password) +
    "&t=" +
    new Date().getTime();


  fetch(url, {

    method: "GET",

    redirect: "follow"

  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    console.log(
      "HASIL LOGIN:",
      result
    );


    if (result.berhasil === true) {

      namaUser = result.nama;

      usernameAktif =
        result.username;


      sessionStorage.setItem(
        "jejakkuUser",
        namaUser
      );


      sessionStorage.setItem(
        "jejakkuUsername",
        usernameAktif
      );


      tampilScanner();

    }

    else {

      errorBox.innerHTML =
        "❌ Username atau password salah";

    }

  })

  .catch(function(error) {

    console.error(
      "ERROR LOGIN:",
      error
    );

    errorBox.innerHTML =
      "❌ Tidak dapat terhubung ke server";

  });
}


/* =====================================================
   TAMPILKAN SCANNER
===================================================== */

function tampilScanner() {

  document
    .getElementById("loginPage")
    .style.display = "none";


  document
    .getElementById("scanPage")
    .style.display = "block";


  document
    .getElementById("namaPetugas")
    .innerText = namaUser;


  document
    .getElementById("formHasil")
    .style.display = "none";


  document
    .getElementById("hasil")
    .innerHTML =
      "📷 Meminta izin kamera...";


  setTimeout(function() {

    mulaiScanner();

  }, 500);
}


/* =====================================================
   MULAI KAMERA
===================================================== */

function mulaiScanner() {

  sudahScan = false;

  sudahSimpan = false;


  document
    .getElementById("formHasil")
    .style.display = "none";


  document
    .getElementById("reader")
    .innerHTML = "";


  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0
    },

    berhasilScan,

    function(errorMessage) {

      // Error pembacaan QR diabaikan

    }

  )

  .then(function() {

    document
      .getElementById("hasil")
      .innerHTML =
        "📷 <b>KAMERA AKTIF</b>" +
        "<br><br>" +
        "Arahkan kamera ke QR Code";

  })

  .catch(function(error) {

    console.error(
      "KAMERA ERROR:",
      error
    );

    document
      .getElementById("hasil")
      .innerHTML =
        "❌ <b>KAMERA TIDAK DAPAT DIAKSES</b>" +
        "<br><br>" +
        "Pastikan izin kamera browser sudah diizinkan.";

  });
}


/* =====================================================
   QR BERHASIL TERBACA
===================================================== */

function berhasilScan(kodeQR) {

  if (sudahScan) {
    return;
  }


  sudahScan = true;

  kodeQRhasil = kodeQR;


  /* HENTIKAN KAMERA */

  if (html5QrCode) {

    html5QrCode
      .stop()
      .then(function() {

        console.log(
          "Kamera dihentikan"
        );

      })
      .catch(function(error) {

        console.log(
          "Stop camera:",
          error
        );

      });

  }


  /* TAMPILKAN HASIL */

  document
    .getElementById("hasil")
    .innerHTML =
      "✅ <b>QR TERBACA</b>";


  document
    .getElementById("kodeQR")
    .innerText =
      kodeQR;


  document
    .getElementById("status")
    .value = "";


  document
    .getElementById("keterangan")
    .value = "";


  document
    .getElementById("formError")
    .innerHTML = "";


  document
    .getElementById("formHasil")
    .style.display = "block";


  /*
     Scroll ke form
  */

  document
    .getElementById("formHasil")
    .scrollIntoView({
      behavior: "smooth"
    });
}


/* =====================================================
   SIMPAN DATA
===================================================== */

function simpanData() {

  if (sudahSimpan) {
    return;
  }


  const status =
    document
      .getElementById("status")
      .value;


  const keterangan =
    document
      .getElementById("keterangan")
      .value
      .trim();


  const formError =
    document
      .getElementById("formError");


  /* CEK STATUS */

  if (!status) {

    formError.innerHTML =
      "❌ Silakan pilih status";

    return;
  }


  /* CEK KETERANGAN */

  if (!keterangan) {

    formError.innerHTML =
      "❌ Silakan isi keterangan";

    return;
  }


  sudahSimpan = true;


  formError.innerHTML =
    "<span class='loading'>" +
    "⏳ Menyimpan data..." +
    "</span>";


  const data = {

    kodeQR:
      kodeQRhasil,

    namaUser:
      namaUser,

    username:
      usernameAktif,

    status:
      status,

    keterangan:
      keterangan

  };


  /* KIRIM KE APPS SCRIPT */

  fetch(WEB_APP_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {

      "Content-Type":
        "text/plain"

    },

    body:
      JSON.stringify(data)

  })

  .then(function() {


    /* BERHASIL */

    document
      .getElementById("formHasil")
      .style.display = "none";


    document
      .getElementById("hasil")
      .innerHTML =
        "<span class='success'>" +
        "✅ DATA BERHASIL DISIMPAN" +
        "</span>" +
        "<br><br>" +
        "Petugas: <b>" +
        namaUser +
        "</b>" +
        "<br>" +
        "Status: <b>" +
        status +
        "</b>";


    /*
       Setelah 1,5 detik,
       kamera aktif lagi.
    */

    setTimeout(function() {

      document
        .getElementById("hasil")
        .innerHTML =
          "📷 <b>SIAP SCAN</b>" +
          "<br><br>" +
          "Arahkan kamera ke QR Code berikutnya";


      document
        .getElementById("reader")
        .innerHTML = "";


      sudahScan = false;

      sudahSimpan = false;


      mulaiScanner();

    }, 1500);

  })

  .catch(function(error) {

    console.error(
      "GAGAL SIMPAN:",
      error
    );


    sudahSimpan = false;


    formError.innerHTML =
      "❌ Gagal menyimpan data." +
      "<br>Silakan coba lagi.";

  });
}

</script>

</body>
</html>
