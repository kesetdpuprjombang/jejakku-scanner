<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEJAKKU</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7eee9;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 30px 15px;
    }

    h1 {
      color: #6b4f45;
      margin-bottom: 5px;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #d88c9a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #loginPage {
      display: block;
    }

    #scanPage {
      display: none;
    }

    #reader {
      background: white;
      border-radius: 15px;
      padding: 10px;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
    }

    .error {
      color: red;
      margin-top: 15px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .user {
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .logout {
      background: #888;
      font-size: 14px;
      padding: 10px;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="container">

  <h1>JEJAKKU</h1>

  <p>LOGIN PETUGAS</p>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="login()">MASUK</button>

  <div id="loginError" class="error"></div>

</div>


<!-- ================= SCANNER ================= -->

<div id="scanPage" class="container">

  <h1>JEJAKKU</h1>

  <p>SCAN QR CODE</p>

  <div class="user">
    Petugas: <b id="namaPetugas"></b>
  </div>

  <div id="reader"></div>

  <div id="hasil">
    Arahkan kamera ke QR Code
  </div>

  <button class="logout" onclick="logout()">
    KELUAR
  </button>

</div>


<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwG9WUnSVBaa1bccVvjchz0teJ7edTLhxrYqm1iACQ4FuMYpSmlWOZR9Lv0SmqiMQM/exec";

let sudahScan = false;
let namaUser = "";


// ================= LOGIN =================

function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  /*
    LOGIN SEMENTARA

    Username : admin
    Password : 12345
  */

  if (username === "admin" && password === "12345") {

    namaUser = "Admin";

    sessionStorage.setItem("jejakkuUser", namaUser);

    tampilScanner();

  } else {

    document.getElementById("loginError").innerHTML =
      "❌ Username atau password salah";
  }
}


// ================= TAMPIL SCANNER =================

function tampilScanner() {

  document.getElementById("loginPage").style.display = "none";

  document.getElementById("scanPage").style.display = "block";

  document.getElementById("namaPetugas").innerText =
    namaUser;

  mulaiScanner();
}


// ================= SCANNER =================

function mulaiScanner() {

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true
    },
    false
  );

  scanner.render(berhasilScan, gagalScan);
}


// ================= HASIL SCAN =================

function berhasilScan(kodeQR) {

  if (sudahScan) return;

  sudahScan = true;

  document.getElementById("hasil").innerHTML =
    "QR TERBACA<br><br>" +
    "<b>" + kodeQR + "</b>" +
    "<br><br>Menyimpan...";

  const data = {
    kodeQR: kodeQR,
    namaUser: namaUser
  };

  fetch(WEB_APP_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {
      "Content-Type": "text/plain"
    },

    body: JSON.stringify(data)

  })
  .then(function() {

    document.getElementById("hasil").innerHTML =
      "<span class='success'>✅ BERHASIL</span>" +
      "<br><br>Kode: <b>" + kodeQR + "</b>" +
      "<br>Petugas: <b>" + namaUser + "</b>";

    setTimeout(function() {

      location.reload();

    }, 1500);

  })
  .catch(function(error) {

    document.getElementById("hasil").innerHTML =
      "❌ Gagal mengirim data";

    sudahScan = false;

  });
}


function gagalScan(error) {
  // error scan diabaikan
}


// ================= LOGOUT =================

function logout() {

  sessionStorage.removeItem("jejakkuUser");

  location.reload();

}

</script>

</body>
</html>
